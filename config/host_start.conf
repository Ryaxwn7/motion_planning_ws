# Host startup config for start_host.sh.
# This file is sourced by bash. Keep it shell-compatible.

START_ROSCORE=false
LAUNCH_MAP_SERVER=true
AUTO_START_GATHER=false
ROSCORE_WAIT=8.0

# Set these to your actual host network values if needed.
ROS_MASTER_URI_VALUE="${ROS_MASTER_URI:-http://192.168.1.104:11311}"
ROS_IP_VALUE="${ROS_IP:-}"
MAP_FILE_VALUE="/home/bsrl-ubuntu/motion_planning_ws/src/turn_on_ws/src/turn_on_wheeltec_robot/map/5x10_2026.yaml"

# Example for non-sequential robots:
#   "robot_ids:=[2,4,7]"
# Explicit robot_ids now overrides host-side robot count resolution.
HOST_LAUNCH_ARGS=(
  "agent_number:=4"
  "robot_ids:=[1,2,3,4]"
  "gather_config:=$(pwd)/src/fm2_gather/config/gather_param_real_simaligned.yaml"
  "enable_map_combine:=true"
  "shape_type:=rectangle"
  "shape_source:=mat"
  "shape_scale:=1.0"
  "auto_shape_heading:=true"
  "r_avoid:=0.35"
  "publish_target_markers:=true"
  "target_marker_topic:=/shape_assembly/target_markers"
  "replan_mode:=event"
  "replan_growth_metric:=gather_cost"
  "gather_cost_source:=arrival_time"
  "arrival_time_topic_suffix:=move_base/GraphPlanner/arrival_time"
  "gather_cost_growth_ratio:=1.2"
  "min_gather_cost_growth_trigger:=0.0"
  "enable_empty_plan_replan:=true"
  "empty_plan_replan_count:=3"
)
