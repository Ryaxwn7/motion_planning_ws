ROS_MASTER_URI_VALUE="${ROS_MASTER_URI:-http://192.168.1.104:11311}"
ROS_IP_VALUE="${ROS_IP:-}"

ROBOT_LAUNCH_ARGS=(
  "map_started:=true"
  "agent_number:=2"
  "agent_id:=4"
  "robot_ids:=[4,5]"
  "global_planner:=fm2"
  "local_planner:=my"
  "robot:=mini_mec"
  "enable_shape_assembly:=true"
  "shape_assembly_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/shape_assembly.yaml"
  "my_local_planner_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/planner/my_local_planner_params.yaml"
  "global_costmap_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/costmap/global_costmap_params.yaml"
  "local_costmap_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/costmap/local_costmap_params.yaml"
  "shape_source:=mat"
  "shape_type:=rectangle"
  "use_center_as_goal:=true"
)
