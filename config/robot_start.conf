# Robot startup config for start_robot.sh.
# Each robot should keep its own local copy of this file and set
# ROS_IP_VALUE / agent_id according to that robot.

ROS_MASTER_URI_VALUE="${ROS_MASTER_URI:-http://127.0.0.1:11311}"
ROS_IP_VALUE="${ROS_IP:-}"

ROBOT_LAUNCH_ARGS=(
  "map_started:=true"
  "agent_number:=4"
  "agent_id:=1"
  "global_planner:=fm2"
  "local_planner:=my"
  "robot:=mini_mec"
  "enable_shape_assembly:=true"
  "shape_source:=mat"
  "shape_type:=rectangle"
  "use_center_as_goal:=false"
)
