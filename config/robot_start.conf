# Robot startup config for start_robot.sh.
# Each robot should keep its own local copy of this file and set
# ROS_IP_VALUE / agent_id according to that robot.

ROS_MASTER_URI_VALUE="${ROS_MASTER_URI:-http://192.168.1.104:11311}"
ROS_IP_VALUE="${ROS_IP:-}"

# Example for non-sequential robots:
#   "agent_id:=7"
#   "robot_ids:=[2,4,7]"
# This default file is only a template. For ids 3/4/5/6, prefer the
# dedicated robot_start.robot{3,4,5,6}.conf files.
# Keep agent_number aligned if you enable planners or scripts that still read it.
ROBOT_LAUNCH_ARGS=(
  "map_started:=true"
  "agent_number:=2"
  "agent_id:=5"
  "robot_ids:=[5,6]"
  "global_planner:=fm2"
  "local_planner:=my"
  "robot:=mini_mec"
  "enable_shape_assembly:=true"
  "enable_amcl_nomotion_update:=true"
  "amcl_nomotion_update_period:=1.0"
  "shape_assembly_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/shape_assembly_real_simaligned.yaml"
  "my_local_planner_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/planner/my_local_planner_params_real_simaligned.yaml"
  "global_costmap_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/costmap/global_costmap_params_real_simaligned.yaml"
  "local_costmap_config:=$(pwd)/src/ros_motion_planning/src/sim_env/config/costmap/local_costmap_params_real_simaligned.yaml"
  "shape_source:=mat"
  "shape_type:=rectangle"
  "use_center_as_goal:=true"
)
