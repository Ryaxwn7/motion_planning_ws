ros:
  master_uri: "http://192.168.1.104:11311"
  ip: ""

time_sync:
  enabled: true
  server: 192.168.1.104

motion_navigate_multi4:
  map_started: true
  agent_number: 4
  agent_id: 5
  start_ns: true
  robot_ids: [3, 4, 5, 6]
  global_planner: fm2
  local_planner: my
  robot: mini_mec
  map_file: "${WS_ROOT}/src/turn_on_ws/src/turn_on_wheeltec_robot/map/5x10_2026.yaml"
  enable_shape_assembly: true
  launch_shape_assembly_host: false
  shape_source: mat
  shape_type: rectangle
  shape_heading: 0.0
  shape_scale: 1.0
  shape_library_root: "${WS_ROOT}/src/ros_motion_planning/src/sim_env/shape_images"
  shape_resolution: 80
  ring_inner_ratio: 0.25
  ring_outer_ratio: 0.4
  gray_width: 4
  staging_radius: 0.0
  auto_shape_heading: true
  use_center_as_goal: true
  gather_config: "${WS_ROOT}/src/fm2_gather/config/gather_param_real_simaligned.yaml"
  enable_map_combine: true
  publish_target_markers: true
  target_marker_topic: /shape_assembly/target_markers
  distributed_marker_owner: ""
  publish_markers: true
  robot_odom_topic_suffix: /robot_pose_ekf/odom_combined

graph_planner:
  convert_offset: 0.0
  default_tolerance: 0.0
  outline_map: true
  obstacle_factor: 0.5
  expand_zone: true
  voronoi_map: false
  fm2:
    distance_field_backend: 2
    v_max: 1.0
    velocity_alpha: 0.2
    velocity_dmax: 0.5
    robot_radius: 0.25
    velocity_mode: 1
    velocity_sigmoid_k: 1.5
    velocity_sigmoid_b: 0.0
    use_gather_style: true
    use_star_heuristic: true
    use_dynamic_obstacle_uncertainty: true
    use_dynamic_obstacle_cluster_tracking: false
    force_full_occupancy_refresh: false
    dynamic_obstacle_threshold: 253
    dynamic_obstacle_unknown_is_obstacle: false
    dynamic_obstacle_inflation_radius: 0.25
    dynamic_obstacle_uncertainty_radius: 0.60
    dynamic_obstacle_stride: 1
    dynamic_obstacle_cluster_min_cells: 2
    dynamic_obstacle_track_match_radius: 0.50
    dynamic_obstacle_track_ttl: 0.60
    static_obstacle_noise_reject_cells: 4
    dynamic_obstacle_max_samples: 800
    debug_velocity_path: /tmp/fm2_velocity.csv
    debug_dump_velocity: false
    debug_visualize: false
    debug_log: false

my_local_planner:
  pre_n: 10
  Kp: 2.0
  Ki: 0.01
  Kd: 3.0
  trans_x_factor: 1.0
  trans_y_factor: 1.0
  trans_factor: 2.0
  target_dist: 0.2
  max_vel_trans: 0.3
  max_vel_rot: 1.0
  acc_scale_trans: 1.5
  acc_scale_rot: 0.5
  adjust_r_factor: 1.0
  goal_dist_tolerance: 0.1
  goal_yaw_tolerance: 0.05
  debug_print: false
  scan_topic: /scan
  base_frame_id: base_footprint
  odom_frame_id: odom_combined

global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  always_send_full_costmap: false
  update_frequency: 8.0
  publish_frequency: 8.0
  transform_tolerance: 0.5
  cost_scaling_factor: 1.5
  inflation_radius: 0.0
  obstacle_layer:
    observation_sources: scan
    scan:
      topic: scan
      sensor_frame: laser
      observation_persistence: 0.0
      expected_update_rate: 0.1
      data_type: LaserScan
      clearing: true
      marking: true
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      obstacle_range: 6.0
      raytrace_range: 6.0
      inf_is_valid: true
  inflation_layer:
    enabled: true
    cost_scaling_factor: 1.5
    inflation_radius: 0.0
  static_map:
    enabled: true
    clear_time: 0.5
    publish_static_map: true
    first_map_only: false
    map_topic: /map
    subscribe_to_updates: false
    track_unknown_space: true

local_costmap:
  global_frame: odom_combined
  robot_base_frame: base_footprint
  update_frequency: 8.0
  publish_frequency: 8.0
  transform_tolerance: 0.5
  rolling_window: true
  width: 2.5
  height: 2.5
  resolution: 0.05
  obstacle_layer:
    observation_sources: scan
    scan:
      topic: scan
      sensor_frame: laser
      observation_persistence: 0.0
      expected_update_rate: 0.1
      data_type: LaserScan
      clearing: true
      marking: true
      max_obstacle_height: 2.0
      min_obstacle_height: 0.0
      obstacle_range: 3.0
      raytrace_range: 3.0
      inf_is_valid: true
  inflation_layer:
    enabled: true
    cost_scaling_factor: 10.0
    inflation_radius: 0.0

shape_assembly:
  enabled: true
  auto_detect: true
  namespace_prefix: robot
  agent_number: 4
  robot_namespaces: []
  distributed_mode: false
  distributed_agent_namespace: ""
  distributed_marker_owner: ""
  use_fm2_gather: true
  publish_center_goal_only: true
  gather_center_topic: /gather_center
  fm2_auto_detect_robots: true
  fm2_robot_detect_topic_suffix: /odom
  fm2_robot_detect_timeout: 8.0
  replan_mode: event
  periodic_interval: 5.0
  cooldown: 0.5
  per_robot_cooldown: 0.5
  max_len_growth_ratio: 1.4
  long_path_replan_min_length: 3.0
  format_radius: 0.3
  enable_stable_len_replan: false
  use_goal_occupied_peer_fallback: true
  goal_occupied_radius: 0.3
  auto_detect_robots: true
  robot_namespace_prefix: robot
  robot_detect_topic_suffix: /odom
  robot_odom_topic_suffix: /robot_pose_ekf/odom_combined
  robot_odom_msg_type: pose_with_covariance_stamped
  robot_velocity_topic_suffix: /odom
  robot_detect_timeout: 8.0
  num_robots: 4
  control_hz: 10.0
  control_dt: 0.0
  sim_dt: 0.0
  r_body: 0.24
  r_safe: 0.30
  r_avoid: 0.33
  r_sense: 1.5
  vel_max: 0.3
  leader_fraction: 1.0
  kappa_conse_pos: 1.6
  kappa_track_pos: 3.0
  kappa_conse_head: 1.6
  kappa_track_head: 1.0
  alpha: 0.8
  hvel_max: 1.57079632679
  kappa_enter: 4.0
  kappa_explore_1: 1.0
  kappa_explore_2: 3.0
  kappa_avoid: 5.0
  kappa_hard_avoid: 5.0
  kappa_consensus: 1.2
  cmd_smooth_ratio: 0.32
  cmd_smooth_use_odom: true
  cmd_scale: 0.5
  cmd_deadzone: 0.01
  yaw_correction_enabled: true
  yaw_tolerance: 0.05
  yaw_linear_slowdown_start: 0.35
  yaw_linear_stop_threshold: 0.80
  shape_vel_max: 0.5
  shape_source: mat
  shape_type: rectangle
  shape_scale: 1.0
  shape_resolution: 80
  ring_inner_ratio: 0.25
  ring_outer_ratio: 0.4
  gray_width: 4
  shape_mat_path: ""
  shape_library_root: ""
  formation_task_topic: /shape_assembly/task
  robot_status_topic: shape_assembly/status
  reference_center: [0.0, 0.0]
  reference_heading: 0.0
  reference_center_topic: /gather_center
  reference_center_wait: true
  reference_center_use_topic_heading: false
  init_center_mode: robot
  init_center_use_reference_only: false
  random_seed: 1
  control_strategy: move_base_then_shape
  shape_target_mode: reference
  force_move_base_mode: false
  force_move_base_mode_topic: shape_assembly/force_move_base_mode
  switch_gray_threshold: 0.95
  cancel_move_base_on_switch: true
  cancel_grace_period: 0.35
  stop_path_planning_on_shape_takeover: false
  switch_use_reference_shape: true
  switch_reference_radius_enable: false
  switch_reference_radius_margin: 0.25
  switch_reference_radius_min: 0.0
  use_local_costmap_avoid: true
  local_costmap_topic_suffix: move_base/local_costmap/costmap
  local_costmap_obstacle_threshold: 80
  local_costmap_unknown_is_obstacle: false
  local_costmap_avoid_radius: 0.30
  local_costmap_avoid_gain: 5.0
  local_costmap_hard_radius: 0.25
  local_costmap_hard_gain: 5.0
  local_costmap_stride: 1
  local_costmap_max_samples: 500
  local_costmap_timeout: 1.0
  local_costmap_self_ignore_radius: 0.20
  local_costmap_skip_on_frame_mismatch: true
  auto_shape_heading: true
  auto_shape_heading_map_topic: /map
  auto_shape_heading_angle_step_deg: 15.0
  auto_shape_heading_update_interval: 0.5
  auto_shape_heading_obstacle_threshold: 80
  auto_shape_heading_unknown_is_obstacle: true
  auto_shape_heading_shape_stride: 2
  auto_shape_heading_min_improve: 0.01
  auto_shape_heading_yaw_bias: 0.02
  auto_shape_heading_oob_is_obstacle: true
  publish_markers: true
  marker_topic: /shape_assembly/markers
  marker_frame: map
  shape_marker_mode: reference
  shape_point_stride: 1
  shape_point_size: 0.05
  shape_color_mode: gradient
  shape_gradient_alpha: 0.9
  shape_black_threshold: 1.0e-6
  shape_black_color: [0.72, 0.94, 0.72]
  shape_black_alpha: 0.9
  shape_gray_color: [0.2, 0.8, 0.2]
  shape_gray_alpha: 0.6
  show_comm_range: true
  comm_range_radius: 0.0
  comm_range_line_width: 0.01
  comm_range_color: [0.1, 0.7, 1.0]
  comm_range_alpha: 0.25
  comm_range_segments: 48
  show_occupancy: true
  occupancy_radius: 0.0
  occupancy_height: 0.02
  occupancy_color: [1.0, 0.6, 0.2]
  occupancy_alpha: 0.2
  publish_links: true
  link_color: [0.2, 0.6, 1.0]
  link_alpha: 0.5
  link_width: 0.02
  link_max_pairs: 0
  show_enter_targets: true
  enter_target_size: 0.08
  enter_target_line_width: 0.02
  enter_target_alpha: 0.85
  debug_log: false
  debug_log_hz: 0.5
  monitor_report_enabled: false
  monitor_report_interval: 5.0
  debug_log_robot_indices: [1, 2, 3, 4]
  debug_log_components: false
  debug_log_metric: false
  velocity_source: odom
  cmd_in_map_frame: true
  odom_twist_in_base: false
  velocity_scale: 1.0
  show_cmd_components: true
  show_cmd_component_text: true
  component_velocity_scale: 1.0
  arrow_shaft_diameter: 0.04
  arrow_head_diameter: 0.08
  arrow_head_length: 0.05
  show_speed_text: true
  speed_text_z: 0.3
  speed_text_size: 0.2
  show_metric_text: true
  metric_text_z: 0.8
  metric_text_size: 0.16
  metric_text_color: [1.0, 1.0, 1.0]
  metric_text_alpha: 0.95
  converge_inside_rate: 0.80
  converge_enter_rate: 0.10
  converge_cover_rate: 0.80
  converge_hold_time: 3.0
