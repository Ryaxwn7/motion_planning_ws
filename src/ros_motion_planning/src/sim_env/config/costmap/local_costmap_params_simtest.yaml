local_costmap:
  global_frame: odom
  robot_base_frame: base_footprint

  update_frequency: 8.0 #8.0 on car
  publish_frequency: 8.0 #8.0 on car
  transform_tolerance: 0.5  

  rolling_window: true
  width: 2.5
  height: 2.5
  resolution: 0.05


    # on car:#
  obstacle_layer:
    observation_sources: scan
    scan:
      {
        topic: scan,
        sensor_frame: laser_link,
        observation_persistence:  0.0,
        expected_update_rate:   0.1,
        data_type:  LaserScan,
        clearing:  true,
        marking: true,
        max_obstacle_height: 2.0,
        min_obstacle_height: 0.0,
        obstacle_range: 3.0,
        raytrace_range: 3.0,
        inf_is_valid: true,
      }

  inflation_layer:
      enabled: true
      cost_scaling_factor: 10.0 # 2.0 exponential rate at which the obstacle cost drops off (default: 10)
      inflation_radius: 0.0 # 0.8 max. distance from an obstacle at which costs are incurred for planning paths.
