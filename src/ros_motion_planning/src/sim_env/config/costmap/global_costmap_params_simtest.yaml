global_costmap:
  global_frame: map
  robot_base_frame: base_footprint
  always_send_full_costmap: false
  update_frequency: 8
  publish_frequency: 8
  transform_tolerance: 0.5
  cost_scaling_factor:  1.5
  inflation_radius: 0.0

  ### Sensor management parameters ###
  obstacle_layer:
    observation_sources: scan
    scan: { 
      topic:                    scan, 
      sensor_frame:             laser_link, 
      observation_persistence:  0.0,
      expected_update_rate:     0.1, 
      data_type:                LaserScan, 
      clearing:                 true, 
      marking:                  true, 
      max_obstacle_height:      2.0,
      min_obstacle_height:      0.0,
      obstacle_range:           6.0,
      raytrace_range:           6.0,
      inf_is_valid:             true
    }  

  combine_layer:
    enabled:              true

  inflation_layer:
    enabled:              true
    cost_scaling_factor:  1.5  # exponential rate at which the obstacle cost drops off (default: 10)
    inflation_radius:     0.0  # max. distance from an obstacle at which costs are incurred for planning paths.

  static_map:
    enabled:              true
    clear_time:           0.5  # time to wait before clearing the static map (default: 2.0)
    publish_static_map:   true
    first_map_only:       false
    map_topic:            /map
    subscribe_to_updates: false # In addition to map_topic, also subscribe to map_topic + "_updates"
    track_unknown_space:  true
