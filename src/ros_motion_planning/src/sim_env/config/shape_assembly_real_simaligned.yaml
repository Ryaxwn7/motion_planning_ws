# Real-robot profile aligned to simtest behavior while keeping real topic/frame names.
enabled: true

# Robot discovery
auto_detect: true
namespace_prefix: robot
agent_number: 4
robot_namespaces: []
distributed_mode: false
distributed_agent_namespace: ""
distributed_marker_owner: ""

# Launch orchestration defaults
use_fm2_gather: true
publish_center_goal_only: true
gather_center_topic: /gather_center
fm2_auto_detect_robots: true
fm2_robot_detect_topic_suffix: /odom
fm2_robot_detect_timeout: 8.0
replan_mode: event
periodic_interval: 5.0
cooldown: 0.5
per_robot_cooldown: 0.5
max_len_growth_ratio: 1.4
long_path_replan_min_length: 3.0
format_radius: 0.3
enable_stable_len_replan: false
use_goal_occupied_peer_fallback: true
goal_occupied_radius: 0.3

# Aliases matching fm2_gather/laun.launch include arg names.
auto_detect_robots: true
robot_namespace_prefix: robot
robot_detect_topic_suffix: /odom
# Real robots expose fused pose on /robotN/robot_pose_ekf/odom_combined
# and body-frame velocity on /robotN/odom.
robot_odom_topic_suffix: /robot_pose_ekf/odom_combined
robot_odom_msg_type: pose_with_covariance_stamped
robot_velocity_topic_suffix: /odom
robot_detect_timeout: 8.0
num_robots: 4

# Control timing
# control_hz is the shape controller loop frequency. Higher values make commands
# update faster but increase CPU/network load. Keep all robots consistent.
control_hz: 10.0
# Leave control_dt/sim_dt at 0 when control_hz is used.
control_dt: 0.0
sim_dt: 0.0

# Swarm parameters
# r_body is the physical body radius used for collision checks.
r_body: 0.24
# r_safe is the short-range safety radius. Increasing it makes robots separate
# earlier; too large can prevent dense formations.
r_safe: 0.30
# r_avoid sets the nominal robot spacing and also affects the shape grid size.
# Increasing it expands the target shape and avoidance distance.
r_avoid: 0.33
# r_sense is neighbor sensing/interaction range. Too small can fragment the
# swarm; too large can make distant robots influence each other unnecessarily.
r_sense: 1.5
# Max published linear speed after all shaping. Raise only if the chassis and
# localization remain stable.
vel_max: 0.4
# Fraction of robots that track the reference shape center/heading directly.
# 1.0 makes all robots informed, usually more predictable for real robots.
leader_fraction: 1.0

# Negotiation gains
# Shape-center consensus/tracking gains. Increase tracking if the negotiated
# shape center lags the reference; decrease if the whole group oscillates.
kappa_conse_pos: 1.6
kappa_track_pos: 3.0
# Heading consensus/tracking gains. kappa_track_head is the yaw P gain used by
# the published angular command; lower it if yaw overshoots or shakes.
kappa_conse_head: 1.6
kappa_track_head: 0.6
# Nonlinear exponent for consensus. Lower values make small errors stronger;
# higher values make small errors softer.
alpha: 0.8
# Max angular speed. Lower this if yaw alignment overshoots.
hvel_max: 0.8

# Enter / explore / interact gains
# Enter gain pulls a robot from gray/white cells toward darker shape cells.
# Increase if robots near the shape boundary receive too-small inward velocity.
kappa_enter: 6.0
# Exploration gains move robots inside the shape toward uncovered dark cells.
# Increase if coverage is slow; decrease if robots wander or churn inside.
kappa_explore_1: 3.0
kappa_explore_2: 3.0
# Robot-robot avoidance gains. Increase if robots get too close; decrease if
# avoidance dominates shape filling.
kappa_avoid: 5.0
kappa_hard_avoid: 5.0
# Velocity-consensus damping between neighbors. Increase to reduce relative
# velocity; too high can make motion sluggish.
kappa_consensus: 1.2

# Output shaping
# Linear command smoothing. With cmd_smooth_use_odom=false, this blends new
# commands with previous commands. Higher ratio follows new commands faster.
cmd_smooth_ratio: 0.8
# false avoids using zero odometry feedback to suppress commands when a real
# robot is stuck. Keep false for low-speed real-chassis tests.
cmd_smooth_use_odom: false
# Multiplies final linear command before deadzone/clamp. Increase if all shape
# commands are too weak; reduce if motion is too aggressive.
cmd_scale: 0.4
# Soft deadzone subtracts this speed from the command magnitude. Increasing it
# suppresses tiny commands; set near 0 if real robots fail to start moving.
cmd_deadzone: 0.0
yaw_correction_enabled: true
# Yaw error tolerance. Larger tolerance stops yaw correction earlier and reduces
# small-angle chatter; too large leaves visible heading error.
yaw_tolerance: 0.08
# Linear speed starts reducing above this yaw error and becomes zero at
# yaw_linear_stop_threshold. Raise slowdown_start to avoid over-restricting
# translation during mild heading error.
yaw_linear_slowdown_start: 0.20
yaw_linear_stop_threshold: 0.90
# Damping on measured yaw rate. Increase if yaw overshoots; decrease if yaw
# response becomes slow or noisy odometry makes angular command jitter.
yaw_rate_damping: 1.0
# Angular command smoothing. Lower values reduce lag and overshoot; higher values
# smooth noise but can carry angular velocity past the target.
yaw_cmd_smooth_ratio: 0.2
# Angular command deadzone. Too large causes on/off shaking near target; too
# small may command constant tiny rotations.
yaw_cmd_deadzone: 0.02
# Limit for internal shape-stage velocity before final vel_max clamp.
shape_vel_max: 0.4

# Shape source
shape_source: mat
shape_type: rectangle
shape_scale: 1.0
shape_resolution: 80
ring_inner_ratio: 0.25
ring_outer_ratio: 0.4
gray_width: 4
shape_mat_path: ""
shape_library_root: ""
formation_task_topic: /shape_assembly/task
robot_status_topic: shape_assembly/status

# Reference shape / switching
# Runtime task messages overwrite reference_center/reference_heading. These
# defaults matter only before a task/gather center is received.
reference_center: [0.0, 0.0]
reference_heading: 0.0
reference_center_topic: /gather_center
reference_center_wait: true
reference_center_use_topic_heading: false
# robot initializes each local shape center from the current robot positions;
# reference initializes all centers from the gather center.
init_center_mode: robot
init_center_use_reference_only: false
random_seed: 1
# move_base_then_shape lets move_base drive to staging/entry, then shape control
# takes over per robot. shape_only bypasses move_base after startup.
control_strategy: move_base_then_shape
# reference makes every robot use the shared target shape for entering/filling.
shape_target_mode: reference
# Set true from dynamic_reconfigure to temporarily return robots to move_base.
force_move_base_mode: false
force_move_base_mode_topic: shape_assembly/force_move_base_mode
# Robot switches to shape control when its shape gray value is below this
# threshold. Lower value switches deeper inside; higher switches earlier.
switch_gray_threshold: 0.95
cancel_move_base_on_switch: true
# After switch, publish zero velocity for this many seconds to let move_base
# cancel cleanly. Too long creates a pause; too short can cause command conflict.
cancel_grace_period: 0.35
stop_path_planning_on_shape_takeover: false
switch_use_reference_shape: true
# Radius switching is disabled here; enabling it can switch robots before they
# enter a valid shape cell if they are near the reference center.
switch_reference_radius_enable: false
switch_reference_radius_margin: 0.25
switch_reference_radius_min: 0.0

# Local costmap avoidance
use_local_costmap_avoid: true
local_costmap_topic_suffix: move_base/local_costmap/costmap
local_costmap_obstacle_threshold: 80
# false means unknown local costmap cells are ignored by this extra avoidance
# layer. Set true only if unknown space should be treated as blocked.
local_costmap_unknown_is_obstacle: false
# Soft obstacle repulsion radius/gain. Increase gain/radius if shape control
# drives too close to obstacles; decrease if it blocks useful motion.
local_costmap_avoid_radius: 0.30
local_costmap_avoid_gain: 4.0
# Hard obstacle repulsion radius/gain. This should stay close to robot body size
# and is intended for near-contact avoidance.
local_costmap_hard_radius: 0.25
local_costmap_hard_gain: 9.0
local_costmap_stride: 1
local_costmap_max_samples: 500
# If the local costmap is older than this, obstacle avoidance is skipped.
local_costmap_timeout: 1.0
# Ignore occupied cells very near the robot footprint to avoid self-detection.
local_costmap_self_ignore_radius: 0.20
local_costmap_skip_on_frame_mismatch: true

# Auto heading
# Chooses a reference shape heading that reduces map-obstacle overlap.
auto_shape_heading: true
auto_shape_heading_map_topic: /map
# Search resolution in degrees. Smaller is more accurate but more expensive and
# can make heading update more frequently between nearby candidates.
auto_shape_heading_angle_step_deg: 15.0
auto_shape_heading_update_interval: 0.5
auto_shape_heading_obstacle_threshold: 80
auto_shape_heading_unknown_is_obstacle: true
auto_shape_heading_shape_stride: 2
# Minimum overlap improvement required before changing heading. Increase to make
# auto heading less sensitive.
auto_shape_heading_min_improve: 0.01
# Bias against changing yaw too much from current heading.
auto_shape_heading_yaw_bias: 0.02
auto_shape_heading_oob_is_obstacle: true

# Visualization
publish_markers: true
marker_topic: /shape_assembly/markers
marker_frame: map
shape_marker_mode: reference
shape_point_stride: 1
shape_point_size: 0.05
shape_color_mode: gradient
shape_gradient_alpha: 0.9
shape_black_threshold: 1.0e-6
shape_black_color: [0.72, 0.94, 0.72]
shape_black_alpha: 0.9
shape_gray_color: [0.2, 0.8, 0.2]
shape_gray_alpha: 0.6
show_comm_range: true
comm_range_radius: 0.0
comm_range_line_width: 0.01
comm_range_color: [0.1, 0.7, 1.0]
comm_range_alpha: 0.25
comm_range_segments: 48
show_occupancy: true
occupancy_radius: 0.0
occupancy_height: 0.02
occupancy_color: [1.0, 0.6, 0.2]
occupancy_alpha: 0.2
publish_links: true
link_color: [0.2, 0.6, 1.0]
link_alpha: 0.5
link_width: 0.02
link_max_pairs: 0
show_enter_targets: true
enter_target_size: 0.08
enter_target_line_width: 0.02
enter_target_alpha: 0.85
debug_log: false
debug_log_hz: 0.5
monitor_report_enabled: false
monitor_report_interval: 5.0
debug_log_robot_indices: [1, 2, 3, 4]
debug_log_components: false
debug_log_metric: false
velocity_source: odom
cmd_in_map_frame: true
odom_twist_in_base: false
velocity_scale: 1.0
show_cmd_components: true
show_cmd_component_text: true
component_velocity_scale: 1.0
arrow_shaft_diameter: 0.04
arrow_head_diameter: 0.08
arrow_head_length: 0.12
show_speed_text: true
speed_text_z: 0.3
speed_text_size: 0.2
show_metric_text: true
metric_text_z: 0.8
metric_text_size: 0.16
metric_text_color: [1.0, 1.0, 1.0]
metric_text_alpha: 0.95
converge_inside_rate: 0.80
converge_enter_rate: 0.10
converge_cover_rate: 0.80
converge_hold_time: 3.0
