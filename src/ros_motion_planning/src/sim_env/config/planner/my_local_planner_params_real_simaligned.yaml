MyPlanner:
  pre_n: 10
  Kp: 2.0
  Ki: 0.01
  Kd: 3.0
  trans_x_factor: 1.0
  trans_y_factor: 1.0
  trans_factor: 2.0
  target_dist: 0.2

  max_vel_trans: 0.3
  max_vel_rot: 1.0
  acc_scale_trans: 1.5
  acc_scale_rot: 0.5

  adjust_r_factor: 1.0
  goal_dist_tolerance: 0.1
  goal_yaw_tolerance: 0.05
  yaw_reference_mode: 1 # 0: 前瞻点y偏差; 1: 目标点朝向yaw
  debug_print: false
  scan_topic: /scan
  base_frame_id: base_footprint
  odom_frame_id: odom_combined
